<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>
*{box-sizing:border-box}body{margin:0;background:#0d0b17;color:#e9deca;font:16px system-ui}main{max-width:540px;margin:auto;padding:18px}h1{font-size:28px;color:#e5bd82;text-align:center}h2{font-size:19px}button{background:#4a365b;border:1px solid #b99975;color:#f4e6d0;border-radius:12px;padding:13px;font-size:16px;margin:5px;min-width:110px}button:disabled{opacity:.4}.panel{background:#201c2c;border:1px solid #5e4b62;border-radius:18px;padding:15px;margin:12px 0}.hidden{display:none}.portrait{height:230px;display:grid;place-items:center;font-size:92px;background:radial-gradient(#6a476b,#181322 72%);border-radius:18px;animation:float 3s ease-in-out infinite}.portrait.hit{animation:hit .2s}@keyframes float{50%{transform:translateY(-4px)}}@keyframes hit{50%{filter:brightness(3);transform:scale(.94)}}.bar{height:12px;border-radius:20px;background:#382735;overflow:hidden}.bar>div{height:100%;background:#c75a69;transition:width .3s}.row{display:flex;justify-content:space-between;gap:8px}.muted{color:#b4a5bd}.heroes{display:grid;grid-template-columns:repeat(2,1fr)}.heroes button{min-width:0}.gold{color:#e9be7a}.dialog{font-style:italic;line-height:1.6}.center{text-align:center}
</style></head><body><main><section id="menu" class="panel center"><h1>ХРАМ СЕМИ ПЕЧАТЕЙ</h1><p class="muted">Семь хранителей. Пять святилищ. Одна древняя тьма.</p><div style="font-size:90px;margin:40px">☾ ✧ ☼</div><button onclick="show('map')">Начать путь</button><button onclick="show('heroes')">Хранители</button></section>
<section id="map" class="hidden"><h1>Карта святилищ</h1><div id="places"></div><button onclick="show('heroes')">Выбрать героя</button><button onclick="show('menu')">Назад</button></section>
<section id="heroes" class="hidden"><h1>Семь хранителей</h1><p class="muted">У каждого своя сила и магия.</p><div id="roster" class="heroes"></div><button onclick="show('map')">К карте</button></section>
<section id="story" class="hidden panel"><h2 id="storyTitle"></h2><p id="storyText" class="dialog"></p><button onclick="startBattle()">Войти в святилище</button><button onclick="show('map')">Отступить</button></section>
<section id="battle" class="hidden"><h1 id="location"></h1><div class="panel"><div class="row"><b id="foe"></b><span id="foeHp"></span></div><div class="bar"><div id="foeBar"></div></div><div class="portrait" id="portrait">◉</div><p id="message" class="center"></p><div class="row"><b id="heroLabel"></b><span id="hp"></span></div><div class="bar"><div id="hpBar" style="background:#4ba8b4"></div></div><p class="gold" id="money"></p><div class="center"><button onclick="attack(false)">Атака</button><button id="special" onclick="attack(true)">Магия</button><button onclick="heal()">Лечение · 15</button></div></div><button onclick="show('map')">Карта</button></section></main>
<script>
const names=['Оракул','Лунная жрица','Страж печатей','Синяя пророчица','Алая провидица','Серафим','Послушница'];
const glyphs=['☉','☾','⚜','✧','✺','✵','❖'],power=[18,22,25,20,28,30,17];
const lands=['Зал забвения','Лунный алтарь','Сад безмолвия','Крыло серафима','Трон пустоты'];
const tales=['Сквозь мраморные стены шепчут забытые голоса. Первая печать дрожит.','Под бледной луной жрица просит тебя остановить искажение.','Здесь каждый цветок помнит погибшего хранителя.','В сломанных крыльях ангела застряла искра древнего света.','За последней дверью ждёт тот, кто создал семь печатей.'];
let s;try{s=JSON.parse(localStorage.getItem('seven_v2'))}catch(e){};s=s||{hero:0,stage:0,coins:0,hp:100,enemy:100,cool:0,wins:0};
let selected=0;const el=id=>document.getElementById(id);
function save(){localStorage.setItem('seven_v2',JSON.stringify(s))}
function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hidden'));el(id).classList.remove('hidden');if(id==='map')renderMap();if(id==='heroes')renderHeroes();if(id==='battle')draw()}
function renderMap(){el('places').innerHTML=lands.map((x,i)=>'<div class="panel"><h2>'+glyphs[i]+' '+x+'</h2><p class="muted">'+(i<=s.stage?'Доступно':'Закрыто: победи предыдущего стража')+'</p><button '+(i>s.stage?'disabled':'')+' onclick="enter('+i+')">Войти</button></div>').join('')}
function renderHeroes(){el('roster').innerHTML=names.map((n,i)=>'<button style="'+(s.hero===i?'border:2px solid #f0cb85':'')+'" onclick="choose('+i+')"><span style="font-size:38px">'+glyphs[i]+'</span><br>'+n+'<br><small>Сила '+power[i]+'</small></button>').join('')}
function choose(i){s.hero=i;save();renderHeroes()}
function enter(i){selected=i;el('storyTitle').textContent=lands[i];el('storyText').textContent=tales[i];show('story')}
function maxEnemy(){return 85+selected*50+s.wins*12}
function startBattle(){s.enemy=maxEnemy();s.cool=0;show('battle');el('message').textContent='Тень преграждает путь.'}
function draw(){el('location').textContent=lands[selected];el('foe').textContent=selected===4?'Владыка пустоты':'Искажённый хранитель';el('foeHp').textContent=Math.max(0,s.enemy)+' / '+maxEnemy();el('foeBar').style.width=100*Math.max(0,s.enemy)/maxEnemy()+'%';el('heroLabel').textContent=names[s.hero];el('hp').textContent=s.hp+' / 100';el('hpBar').style.width=s.hp+'%';el('money').textContent='Осколки: '+s.coins;el('portrait').textContent=glyphs[(selected+3)%7];el('special').disabled=s.cool>0;el('special').textContent=s.cool?'Магия ('+s.cool+')':'Магия';save()}
function attack(magic){if(s.hp<=0){el('message').textContent='Хранитель пал. Используй лечение или начни путь заново.';return}if(magic&&s.cool)return;let d=power[s.hero]+Math.floor(Math.random()*12)+(magic?30:0);s.enemy-=d;s.cool=magic?3:Math.max(0,s.cool-1);el('portrait').classList.remove('hit');void el('portrait').offsetWidth;el('portrait').classList.add('hit');if(s.enemy<=0){s.coins+=20+selected*10;s.wins++;s.stage=Math.min(4,Math.max(s.stage,selected+1));s.hp=Math.min(100,s.hp+22);el('message').textContent=selected===4?'Последняя печать очищена!':'Победа! Открыта следующая область.';draw();setTimeout(()=>show('map'),1100);return}let taken=8+selected*4+Math.floor(Math.random()*8);s.hp=Math.max(0,s.hp-taken);el('message').textContent='Урон '+d+'. Ответный удар: '+taken+'.';draw()}
function heal(){if(s.coins>=15&&s.hp<100){s.coins-=15;s.hp=Math.min(100,s.hp+40);el('message').textContent='Свет печати восстановил силы.';draw()}}
show('menu');
</script></body></html>
