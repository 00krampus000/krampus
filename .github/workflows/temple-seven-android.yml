name: TempleSeven Android APK
on:
  workflow_dispatch:
  push:
    branches: [temple-seven-android]
    paths:
      - 'TempleSeven/**'
      - '.github/workflows/temple-seven-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TempleSeven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TempleSeven-APK
          path: TempleSeven/app/build/outputs/apk/debug/*.apk
